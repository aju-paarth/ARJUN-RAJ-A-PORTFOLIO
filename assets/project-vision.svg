<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="visBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#visBg)" rx="16"/>

  <!-- Futuristic camera viewfinder frame -->
  <rect x="70" y="45" width="460" height="270" rx="12" fill="#090d16" stroke="#334155" stroke-width="1.5" />
  
  <!-- Viewfinder corner brackets -->
  <path d="M 85 70 H 110 M 85 70 V 95" stroke="#ec4899" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 515 70 H 490 M 515 70 V 95" stroke="#ec4899" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 85 290 H 110 M 85 290 V 265" stroke="#ec4899" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 515 290 H 490 M 515 290 V 265" stroke="#ec4899" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Target 1: Detected Object Box -->
  <rect x="130" y="85" width="170" height="180" rx="4" fill="#8b5cf6" fill-opacity="0.1" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5,3" />
  <rect x="130" y="65" width="135" height="20" rx="3" fill="#8b5cf6" />
  <text x="136" y="79" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">TARGET_01: 98.4%</text>
  
  <!-- Target 1 Inner details (person icon / outline) -->
  <circle cx="215" cy="140" r="24" fill="#a855f7" opacity="0.4" />
  <path d="M 180 235 C 180 185, 250 185, 250 235 Z" fill="#a855f7" opacity="0.3" />
  <circle cx="215" cy="140" r="4" fill="#ec4899" />

  <!-- Target 2: Secondary Object Box -->
  <rect x="340" y="115" width="140" height="130" rx="4" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-width="2" />
  <rect x="340" y="95" width="125" height="20" rx="3" fill="#06b6d4" />
  <text x="346" y="109" fill="#090d16" font-family="monospace" font-size="11" font-weight="bold">DEVICE: 96.2%</text>
  
  <!-- Bounding box crosshair -->
  <line x1="400" y1="170" x2="420" y2="170" stroke="#06b6d4" stroke-width="2" />
  <line x1="410" y1="160" x2="410" y2="180" stroke="#06b6d4" stroke-width="2" />

  <!-- Status HUD at bottom -->
  <rect x="90" y="270" width="420" height="32" rx="6" fill="#1e293b" opacity="0.8" />
  <circle cx="110" cy="286" r="4" fill="#10b981" />
  <text x="122" y="290" fill="#e2e8f0" font-family="monospace" font-size="11">MODEL: YOLOv8-Custom</text>
  <text x="310" y="290" fill="#94a3b8" font-family="monospace" font-size="11">FPS: 48.2</text>
  <text x="410" y="290" fill="#38bdf8" font-family="monospace" font-size="11">LATENCY: 18ms</text>
</svg>
