<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="medBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="360" fill="url(#medBg)" rx="16"/>

  <!-- Grid lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="0" y1="90" x2="600" y2="90" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="270" x2="600" y2="270" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
  </g>

  <!-- Smart Medicine Box Device Chassis -->
  <rect x="140" y="70" width="320" height="220" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  
  <!-- Device Header Banner & Display Screen -->
  <rect x="170" y="95" width="260" height="50" rx="8" fill="#090d16" stroke="#0284c7" stroke-width="1.5" />
  <!-- Display Text & Indicators -->
  <circle cx="190" cy="120" r="5" fill="#10b981" />
  <text x="205" y="124" fill="#38bdf8" font-family="system-ui, monospace" font-size="13" font-weight="bold">MEDIGUARD 7X • READY</text>
  <text x="385" y="124" fill="#94a3b8" font-family="system-ui, monospace" font-size="11">08:00 AM</text>

  <!-- 7 Pill Compartments (7 Days / Multi-Slot) -->
  <g transform="translate(160, 165)">
    <!-- Day 1 Slot -->
    <rect x="0" y="0" width="36" height="60" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
    <rect x="6" y="8" width="24" height="20" rx="10" fill="url(#pillGrad1)" />
    <text x="18" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">MON</text>

    <!-- Day 2 Slot -->
    <rect x="42" y="0" width="36" height="60" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
    <rect x="48" y="8" width="24" height="20" rx="10" fill="url(#pillGrad2)" />
    <text x="60" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">TUE</text>

    <!-- Day 3 Slot -->
    <rect x="84" y="0" width="36" height="60" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <rect x="90" y="8" width="24" height="20" rx="10" fill="url(#pillGrad1)" />
    <!-- Active Glow Indicator -->
    <circle cx="102" cy="50" r="4" fill="#10b981" />

    <!-- Day 4 Slot -->
    <rect x="126" y="0" width="36" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="144" y="50" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">THU</text>

    <!-- Day 5 Slot -->
    <rect x="168" y="0" width="36" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="186" y="50" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">FRI</text>

    <!-- Day 6 Slot -->
    <rect x="210" y="0" width="36" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="228" y="50" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">SAT</text>

    <!-- Day 7 Slot -->
    <rect x="252" y="0" width="36" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="270" y="50" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">SUN</text>
  </g>

  <!-- Hardware Indicators & IoT Signals -->
  <!-- Wi-Fi / MQTT Signal -->
  <path d="M 475 100 A 20 20 0 0 1 505 100" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M 480 106 A 14 14 0 0 1 500 106" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" />
  <circle cx="490" cy="112" r="2.5" fill="#38bdf8" />
  <text x="525" y="110" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">WiFi / MQTT</text>

  <!-- Lock Security Indicator -->
  <rect x="80" y="100" width="30" height="24" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <path d="M 87 100 V 93 A 8 8 0 0 1 103 93 V 100" stroke="#10b981" stroke-width="1.5" fill="none"/>
  <circle cx="95" cy="112" r="2" fill="#10b981" />
  <text x="45" y="140" fill="#10b981" font-family="system-ui, sans-serif" font-size="11">Secure Solenoid Lock</text>

  <!-- Tag Pill -->
  <rect x="225" y="248" width="150" height="24" rx="12" fill="#0284c7" opacity="0.3" stroke="#38bdf8" stroke-width="1" />
  <text x="300" y="264" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">ESP32 • IoT • Cloud</text>
</svg>
