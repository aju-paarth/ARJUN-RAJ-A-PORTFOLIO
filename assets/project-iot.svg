<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="iotBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#iotBg)" rx="16"/>

  <!-- Dashboard Window -->
  <rect x="50" y="40" width="500" height="280" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  
  <!-- Window Top Bar -->
  <rect x="50" y="40" width="500" height="36" rx="12" fill="#0f172a" />
  <circle cx="75" cy="58" r="4.5" fill="#ef4444" />
  <circle cx="90" cy="58" r="4.5" fill="#f59e0b" />
  <circle cx="105" cy="58" r="4.5" fill="#10b981" />
  <text x="300" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Telemetry &amp; Node Dashboard</text>

  <!-- Metric Card 1 -->
  <rect x="75" y="95" width="135" height="70" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" />
  <text x="90" y="118" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">ESP32 SENSORS</text>
  <text x="90" y="146" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">24 Active</text>

  <!-- Metric Card 2 -->
  <rect x="230" y="95" width="135" height="70" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" />
  <text x="245" y="118" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">MQTT PACKETS</text>
  <text x="245" y="146" fill="#34d399" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">1.2k / s</text>

  <!-- Metric Card 3 -->
  <rect x="385" y="95" width="140" height="70" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" />
  <text x="400" y="118" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">UPTIME</text>
  <text x="400" y="146" fill="#c084fc" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">99.98%</text>

  <!-- Big Telemetry Waveform Chart -->
  <rect x="75" y="180" width="450" height="120" rx="8" fill="#0f172a" />
  
  <!-- Waveform Area & Line -->
  <path d="M 90 270 Q 140 210, 190 240 T 290 200 T 390 230 T 490 195 V 280 H 90 Z" fill="url(#chartGrad)" />
  <path d="M 90 270 Q 140 210, 190 240 T 290 200 T 390 230 T 490 195" fill="none" stroke="#10b981" stroke-width="2.5" />
  
  <!-- Data nodes on graph -->
  <circle cx="190" cy="240" r="3.5" fill="#34d399" />
  <circle cx="290" cy="200" r="3.5" fill="#34d399" />
  <circle cx="390" cy="230" r="3.5" fill="#34d399" />
  <circle cx="490" cy="195" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
</svg>
