<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="lsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="hillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#lsBg)" rx="16"/>

  <!-- Top Title Bar -->
  <rect x="30" y="24" width="540" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <circle cx="50" cy="42" r="5" fill="#f59e0b" />
  <text x="65" y="46" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">DUAL-NODE IOT LANDSLIDE EARLY WARNING SYSTEM</text>
  <text x="510" y="46" fill="#10b981" font-family="monospace" font-size="11">LIVE TELEMETRY</text>

  <!-- Left: Node 1 (Data Acquisition) -->
  <g transform="translate(45, 80)">
    <rect x="0" y="0" width="200" height="230" rx="12" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
    <rect x="0" y="0" width="200" height="36" rx="12" fill="#1e293b" />
    <circle cx="20" cy="18" r="4" fill="#38bdf8" />
    <text x="32" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">NODE 1: Sensor Cluster</text>

    <!-- Soil Moisture Module -->
    <rect x="15" y="50" width="170" height="50" rx="8" fill="#1e293b" />
    <text x="25" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">SOIL SATURATION</text>
    <text x="25" y="88" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">82.4% (Elevated)</text>

    <!-- Vibration Sensor Module -->
    <rect x="15" y="110" width="170" height="50" rx="8" fill="#1e293b" />
    <text x="25" y="128" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">SEISMIC / VIBRATION</text>
    <text x="25" y="148" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">0.42g (Instability)</text>

    <!-- Node 1 Microcontroller Badge -->
    <rect x="15" y="175" width="170" height="38" rx="6" fill="#090d16" stroke="#334155" stroke-width="1" />
    <text x="25" y="198" fill="#cbd5e1" font-family="monospace" font-size="10">ESP32 &bull; ADC Read &amp; Classify</text>
  </g>

  <!-- Center: Wireless Link (Wi-Fi) -->
  <g transform="translate(265, 160)">
    <line x1="0" y1="20" x2="70" y2="20" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4" />
    <circle cx="35" cy="8" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <!-- WiFi icon -->
    <path d="M 27 5 A 12 12 0 0 1 43 5" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 30 9 A 7 7 0 0 1 40 9" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="35" cy="12" r="1.5" fill="#38bdf8" />
    <text x="35" y="42" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Wi-Fi Sync</text>
  </g>

  <!-- Right: Node 2 (Alert & Cloud Gateway) -->
  <g transform="translate(355, 80)">
    <rect x="0" y="0" width="200" height="230" rx="12" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" />
    <rect x="0" y="0" width="200" height="36" rx="12" fill="#1e293b" />
    <circle cx="20" cy="18" r="4" fill="#a855f7" />
    <text x="32" y="22" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">NODE 2: Alert Unit</text>

    <!-- Telegram Bot Integration -->
    <rect x="15" y="50" width="170" height="60" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1" />
    <text x="25" y="68" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">TELEGRAM BOT API</text>
    <text x="25" y="86" fill="#f87171" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">⚠️ WARNING: SLIP DETECTED</text>
    <text x="25" y="100" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8">Push Alert &rarr; Authorities</text>

    <!-- Local Alarm -->
    <rect x="15" y="120" width="170" height="42" rx="8" fill="#1e293b" />
    <text x="25" y="137" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">LOCAL ALERTS</text>
    <text x="25" y="152" fill="#10b981" font-family="system-ui, sans-serif" font-size="8.5">Active Buzzer &amp; Hazard LEDs</text>

    <!-- Node 2 Controller Badge -->
    <rect x="15" y="175" width="170" height="38" rx="6" fill="#090d16" stroke="#334155" stroke-width="1" />
    <text x="25" y="198" fill="#cbd5e1" font-family="monospace" font-size="10">ESP32 &bull; Cloud Gateway</text>
  </g>
</svg>
