<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="mobBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="appScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#mobBg)" rx="16"/>

  <!-- Mobile phone frame -->
  <rect x="220" y="20" width="160" height="320" rx="24" fill="#090d16" stroke="#475569" stroke-width="3" />
  
  <!-- Notch / speaker -->
  <rect x="265" y="30" width="70" height="12" rx="6" fill="#1e293b" />
  <circle cx="320" cy="36" r="2.5" fill="#0284c7" />

  <!-- Screen Content -->
  <rect x="230" y="52" width="140" height="270" rx="14" fill="#0f172a" />
  
  <!-- App Header -->
  <text x="245" y="76" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">IoT Manager</text>
  <circle cx="355" cy="73" r="5" fill="#10b981" />

  <!-- App Card 1: Device Status -->
  <rect x="240" y="90" width="120" height="55" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="250" y="108" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Active Device</text>
  <text x="250" y="125" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">ESP32 Hub #4</text>
  <text x="250" y="137" fill="#10b981" font-family="system-ui, sans-serif" font-size="8">Connected • 24ms</text>

  <!-- App Card 2: Quick Controls / Switches -->
  <rect x="240" y="155" width="120" height="42" rx="8" fill="#1e293b" />
  <text x="250" y="174" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">Auto Dispenser</text>
  <rect x="320" y="165" width="30" height="16" rx="8" fill="#10b981" />
  <circle cx="340" cy="173" r="6" fill="#ffffff" />

  <!-- App Card 3: Notifications -->
  <rect x="240" y="205" width="120" height="42" rx="8" fill="#1e293b" />
  <text x="250" y="224" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">Smart Alert Push</text>
  <rect x="320" y="215" width="30" height="16" rx="8" fill="#0ea5e9" />
  <circle cx="340" cy="223" r="6" fill="#ffffff" />

  <!-- App Nav Bar at bottom -->
  <rect x="230" y="295" width="140" height="27" rx="0" fill="#090d16" />
  <circle cx="255" cy="308" r="4" fill="#38bdf8" />
  <circle cx="300" cy="308" r="4" fill="#64748b" />
  <circle cx="345" cy="308" r="4" fill="#64748b" />

  <!-- Side accents & floating badge -->
  <g transform="translate(70, 130)">
    <rect x="0" y="0" width="120" height="60" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="12" y="25" fill="#a855f7" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">FLUTTER / DART</text>
    <text x="12" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Android &amp; iOS Bridge</text>
  </g>
  <g transform="translate(410, 170)">
    <rect x="0" y="0" width="120" height="60" rx="10" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="12" y="25" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">BLUETOOTH LE</text>
    <text x="12" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Real-time telemetry</text>
  </g>
</svg>
